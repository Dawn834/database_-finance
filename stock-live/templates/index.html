<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Real-Time Stocks</title>
    <script src="https://cdn.socket.io/4.3.2/socket.io.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f9f9f9;
            margin: 0;
        }

        h1 {
            display: flex;
            align-items: center;
            color: #333;
            margin-bottom: 20px;
        }

        h1 img {
            width: 30px;
            margin-right: 10px;
        }

        table {
            border-collapse: collapse;
            margin-top: 20px;
            width: 100%;
            background: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 12px 15px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background-color: #f0f0f0;
            font-weight: bold;
            color: #333;
        }

        .symbol-cell {
            font-weight: bold;
            color: #0066cc;
        }

        .price-cell {
            font-weight: bold;
            color: #333;
            font-size: 16px;
        }

        .up {
            color: #28a745;
            font-weight: bold;
        }

        .down {
            color: #dc3545;
            font-weight: bold;
        }

        .neutral {
            color: #6c757d;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 18px;
        }

        .status {
            margin-top: 20px;
            padding: 10px;
            background: #e9ecef;
            border-radius: 5px;
            font-size: 14px;
            color: #495057;
        }

        .connected {
            background: #d4edda;
            color: #155724;
        }

        .disconnected {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h1>
        <img src="https://img.icons8.com/ios-filled/50/000000/stocks.png" alt="Stock Icon" />
        Real-Time Stock Prices
    </h1>

    <div id="status" class="status">Đang kết nối...</div>
    <div id="loading" class="loading">Đang tải dữ liệu cổ phiếu...</div>

    <table id="stockTable" style="display: none;">
        <thead>
            <tr>
                <th>Mã Cổ Phiếu</th>
                <th>Giá (US$)</th>
                <th>Thay Đổi (%)</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        const socket = io();
        let isConnected = false;

        // Connection status handling
        socket.on('connect', function() {
            console.log('[INFO] Connected to server');
            isConnected = true;
            updateStatus('Đã kết nối - Đang chờ dữ liệu...', 'connected');
        });

        socket.on('disconnect', function() {
            console.log('[INFO] Disconnected from server');
            isConnected = false;
            updateStatus('Mất kết nối - Đang thử kết nối lại...', 'disconnected');
        });

        function updateStatus(message, className) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${className}`;
        }

        // Stock data handling
        socket.on("stock_data", function(data) {
            console.log("[DEBUG] Received stock data:", data);
            
            const tbody = document.querySelector("#stockTable tbody");
            const loadingDiv = document.getElementById("loading");
            const stockTable = document.getElementById("stockTable");
            
            // Hide loading and show table
            loadingDiv.style.display = "none";
            stockTable.style.display = "table";
            updateStatus(`Cập nhật lúc: ${new Date().toLocaleTimeString('vi-VN')}`, 'connected');
            
            // Clear old rows
            tbody.innerHTML = "";

            // Check if data is valid
            if (!Array.isArray(data) || data.length === 0) {
                const row = document.createElement("tr");
                const cell = document.createElement("td");
                cell.colSpan = 3;
                cell.textContent = "Không có dữ liệu";
                cell.style.textAlign = "center";
                cell.style.color = "#666";
                row.appendChild(cell);
                tbody.appendChild(row);
                return;
            }

            data.forEach(stock => {
                const row = document.createElement("tr");

                // Symbol cell
                const symbolCell = document.createElement("td");
                symbolCell.className = "symbol-cell";
                symbolCell.textContent = stock.symbol || "N/A";

                // Price cell with proper formatting
                const priceCell = document.createElement("td");
                priceCell.className = "price-cell";
                
                let numericPrice = parseFloat(stock.price);
                if (isNaN(numericPrice) || numericPrice === null || numericPrice === undefined) {
                    priceCell.textContent = "N/A";
                } else {
                    // Format price with comma separator and 2 decimal places
                    const formattedPrice = numericPrice.toLocaleString('en-US', {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    });
                    priceCell.textContent = `US$ ${formattedPrice}`;
                }

                // Change cell
                const changeCell = document.createElement("td");
                let numericChange = parseFloat(stock.change);
                
                if (isNaN(numericChange) || numericChange === null || numericChange === undefined) {
                    changeCell.textContent = "N/A";
                    changeCell.className = "neutral";
                } else {
                    changeCell.textContent = numericChange.toFixed(2) + "%";
                    
                    if (numericChange > 0) {
                        changeCell.className = "up";
                        changeCell.textContent = "+" + changeCell.textContent;
                    } else if (numericChange < 0) {
                        changeCell.className = "down";
                    } else {
                        changeCell.className = "neutral";
                    }
                }

                // Add cells to row
                row.appendChild(symbolCell);
                row.appendChild(priceCell);
                row.appendChild(changeCell);
                tbody.appendChild(row);
            });
        });

        // Error handling
        socket.on('connect_error', function(error) {
            console.error('[ERROR] Connection failed:', error);
            updateStatus('Lỗi kết nối - Vui lòng thử lại', 'disconnected');
        });

        // Retry connection every 5 seconds if disconnected
        setInterval(function() {
            if (!isConnected && !socket.connected) {
                console.log('[INFO] Attempting to reconnect...');
                socket.connect();
            }
        }, 5000);
    </script>
</body>
</html>
