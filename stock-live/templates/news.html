<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tin tức cổ phiếu</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: white;
      margin-bottom: 30px;
      font-size: 2.5rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    .navigation {
      text-align: center;
      margin-bottom: 30px;
    }

    .nav-link {
      display: inline-block;
      padding: 12px 24px;
      background: rgba(255,255,255,0.2);
      color: white;
      text-decoration: none;
      border-radius: 25px;
      margin: 0 10px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.3);
      transition: all 0.3s ease;
    }

    .nav-link:hover {
      background: rgba(255,255,255,0.3);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .status {
      text-align: center;
      margin-bottom: 20px;
      padding: 15px;
      border-radius: 10px;
      font-weight: bold;
    }

    .loading {
      background: rgba(255,255,255,0.9);
      color: #333;
    }

    .error {
      background: rgba(220,53,69,0.9);
      color: white;
      display: none;
    }

    .success {
      background: rgba(40,167,69,0.9);
      color: white;
    }

    #news-container {
      display: grid;
      gap: 25px;
    }

    .symbol-group {
      background: rgba(255,255,255,0.95);
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
      animation: fadeInUp 0.6s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .symbol-group h2 {
      color: #2d3748;
      margin-bottom: 20px;
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .symbol-badge {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: bold;
    }

    .articles-grid {
      display: grid;
      gap: 20px;
    }

    .article {
      padding: 20px;
      border-radius: 10px;
      background: linear-gradient(135deg, #f8f9ff 0%, #e6f3ff 100%);
      border-left: 4px solid #667eea;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .article::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(102,126,234,0.05), rgba(118,75,162,0.05));
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .article:hover::before {
      opacity: 1;
    }

    .article:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(102,126,234,0.2);
      border-left-color: #764ba2;
    }

    .article-title {
      font-weight: bold;
      text-decoration: none;
      color: #2d3748;
      font-size: 1.2rem;
      line-height: 1.4;
      display: block;
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
      transition: color 0.3s ease;
    }

    .article-title:hover {
      color: #667eea;
    }

    .article-description {
      color: #4a5568;
      line-height: 1.6;
      margin-bottom: 15px;
      position: relative;
      z-index: 1;
    }

    .article-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      color: #718096;
      position: relative;
      z-index: 1;
    }

    .article-source {
      background: rgba(102,126,234,0.1);
      padding: 4px 12px;
      border-radius: 15px;
      font-weight: 500;
    }

    .no-news {
      text-align: center;
      color: #666;
      font-style: italic;
      padding: 40px;
      background: rgba(255,255,255,0.9);
      border-radius: 15px;
      margin-top: 20px;
    }

    .refresh-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      padding: 15px;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(102,126,234,0.4);
      transition: all 0.3s ease;
      font-size: 1.2rem;
    }

    .refresh-btn:hover {
      transform: rotate(180deg) scale(1.1);
      box-shadow: 0 8px 25px rgba(102,126,234,0.6);
    }

    @media (max-width: 768px) {
      .container {
        padding: 10px;
      }
      
      h1 {
        font-size: 2rem;
      }
      
      .symbol-group {
        padding: 20px;
      }
      
      .nav-link {
        display: block;
        margin: 5px 0;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📈 Tin tức cổ phiếu mới nhất</h1>
    
    <div class="navigation">
      <a href="/" class="nav-link">🏠 Trang chủ</a>
      <a href="/news" class="nav-link">📰 Tin tức</a>
    </div>

    <div id="loading" class="status loading">🔄 Đang tải tin tức...</div>
    <div id="error" class="status error">❌ Không thể tải tin tức. Vui lòng thử lại sau.</div>
    <div id="success" class="status success" style="display:none;">✅ Đã tải thành công!</div>
    
    <div id="news-container"></div>
  </div>

  <button class="refresh-btn" onclick="fetchNews()" title="Làm mới tin tức">🔄</button>

  <script>
    let isLoading = false;

    async function fetchNews() {
      if (isLoading) return;
      
      const container = document.getElementById('news-container');
      const loading = document.getElementById('loading');
      const error = document.getElementById('error');
      const success = document.getElementById('success');

      try {
        isLoading = true;
        
        // Show loading state
        loading.style.display = 'block';
        error.style.display = 'none';
        success.style.display = 'none';
        container.innerHTML = '';

        console.log('[INFO] Fetching news data...');
        const res = await fetch('/api/news');
        
        if (!res.ok) {
          throw new Error(`HTTP ${res.status}: ${res.statusText}`);
        }
        
        const data = await res.json();
        console.log('[INFO] News data received:', data);
        
        // Hide loading
        loading.style.display = 'none';
        success.style.display = 'block';
        
        // Hide success message after 3 seconds
        setTimeout(() => {
          success.style.display = 'none';
        }, 3000);

        let hasNews = false;

        for (const [symbol, articles] of Object.entries(data)) {
          if (!articles || !Array.isArray(articles) || articles.length === 0) {
            console.log(`[INFO] No articles for ${symbol}`);
            continue;
          }

          hasNews = true;
          const group = document.createElement('div');
          group.className = 'symbol-group';
          
          const header = document.createElement('h2');
          header.innerHTML = `
            <span class="symbol-badge">${symbol}</span>
            <span>${getCompanyName(symbol)}</span>
          `;
          group.appendChild(header);

          const articlesContainer = document.createElement('div');
          articlesContainer.className = 'articles-grid';

          articles.forEach((article, index) => {
            const articleDiv = document.createElement('div');
            articleDiv.className = 'article';
            articleDiv.style.animationDelay = `${index * 0.1}s`;
            
            const title = article.title || 'Tiêu đề không có sẵn';
            const description = article.description || 'Mô tả không có sẵn';
            const url = article.url || '#';
            const publishedAt = article.publishedAt ? new Date(article.publishedAt).toLocaleString('vi-VN') : 'Thời gian không xác định';
            const source = article.source || 'Nguồn không xác định';

            articleDiv.innerHTML = `
              <a href="${url}" target="_blank" class="article-title" rel="noopener noreferrer">
                ${title}
              </a>
              <p class="article-description">${description}</p>
              <div class="article-meta">
                <span class="article-source">${source}</span>
                <small>${publishedAt}</small>
              </div>
            `;
            
            articlesContainer.appendChild(articleDiv);
          });

          group.appendChild(articlesContainer);
          container.appendChild(group);
        }

        if (!hasNews) {
          container.innerHTML = '<div class="no-news">📰 Không có tin tức nào để hiển thị.</div>';
        }

      } catch (e) {
        console.error('[ERROR] Failed to fetch news:', e);
        loading.style.display = 'none';
        error.style.display = 'block';
        success.style.display = 'none';
        
        container.innerHTML = `
          <div class="no-news">
            ❌ Lỗi khi tải tin tức: ${e.message}<br>
            <button onclick="fetchNews()" style="margin-top: 10px; padding: 8px 16px; border: none; border-radius: 5px; background: #667eea; color: white; cursor: pointer;">
              Thử lại
            </button>
          </div>
        `;
      } finally {
        isLoading = false;
      }
    }

    function getCompanyName(symbol) {
      const names = {
        'AAPL': 'Apple Inc.',
        'GOOGL': 'Alphabet Inc.',
        'MSFT': 'Microsoft Corporation',
        'NVDA': 'NVIDIA Corporation',
        'TSLA': 'Tesla Inc.'
      };
      return names[symbol] || symbol;
    }

    // Load news when page loads
    document.addEventListener('DOMContentLoaded', fetchNews);

    // Auto refresh every 5 minutes
    setInterval(fetchNews, 5 * 60 * 1000);
  </script>
</body>
</html>
